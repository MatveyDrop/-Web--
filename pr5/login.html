<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ТЕМП</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <img src="logoTemp.jpg" alt="Логотип ТЕМП">
            <span>ТЕМП</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="login.html" class="active">Войти</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-page">
        <div class="login-logo">
            <img src="logoTemp.jpg" alt="Логотип ТЕМП">
        </div>
        <h2>Вход для сотрудников</h2>
        <form class="login-form" action="#" method="post" novalidate>
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" placeholder="Введите логин" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" autocomplete="current-password">
            </div>
            <p id="login-error" class="form-error" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary">Войти</button>
            <p class="login-hint">Демо-доступ: admin / admin123 или manager / manager123</p>
        </form>
    </main>

    <footer>
        <div class="container">
            <div>
                <p>
                    <img src="icon-mail-white.png" alt="" class="icon-sm">
                    <a href="mailto:info@temp.ru">info@temp.ru</a>
                </p>
                <p>
                    <img src="icon-phone.png" alt="" class="icon-sm icon-phone">
                    <a href="tel:+79289641260">+7 (928) 964-12-60</a>
                </p>
                <p>ИНН: [номер]</p>
            </div>
            <div class="copyright">
                <p>&copy; 2016-2026. ООО "ТЕМП"</p>
            </div>
        </div>
    </footer>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/common.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
